name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter vite-example build
      - run: pnpm --filter next-example build
      - run: pnpm --filter next-mobile-example build
      - run: pnpm --filter @vutrgsinh97/ui-react-web pack --pack-destination ../../
